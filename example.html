<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowstorm Demo — snowjs-best-vertion-ever-made</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #eaf2ff;
            background: radial-gradient(circle at 50% 0%, #24406b 0%, #101a2c 55%, #070c14 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow-x: hidden;
        }

        .hero {
            position: relative;
            z-index: 1000;
            padding: 40px 24px;
        }

        .hero h1 {
            font-size: clamp(28px, 6vw, 56px);
            margin: 0 0 12px;
            letter-spacing: -.02em;
        }

        .hero p {
            margin: 0 auto 28px;
            max-width: 560px;
            color: #b9c8e4;
            font-size: 16px;
            line-height: 1.6;
        }

        .btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, .25);
            background: rgba(255, 255, 255, .08);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            padding: 12px 22px;
            border-radius: 999px;
            cursor: pointer;
            transition: .2s;
            backdrop-filter: blur(6px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, .18);
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <div class="hero">
        <h1>❄️ Let it snow ❄️</h1>
        <p>
            A tiny, dependency-free JavaScript snow effect (DHTML Snowstorm).
            Drop <code>snow.js</code> on any page and the snow starts automatically.
        </p>
        <button class="btn" id="toggle-snow">Toggle snow</button>
    </div>

    <!-- 1) Load the snow script -->
    <script src="snow.js" type="text/javascript"></script>

    <!-- 2) Optionally customize it BEFORE the page finishes loading (the effect auto-starts on window load) -->
    <script type="text/javascript">
        // All options are optional — these are just showing what you can tweak.
        snowStorm.snowColor = '#eef6ff';      // flake color
        snowStorm.flakesMax = 128;            // total flakes created
        snowStorm.flakesMaxActive = 64;       // max falling at once
        snowStorm.animationInterval = 33;     // ms per frame (lower = smoother, more CPU)
        snowStorm.useGPU = true;              // hardware-accelerated movement
        snowStorm.snowStick = true;           // snow collects at the bottom
        snowStorm.useMeltEffect = true;       // melting/fading
        snowStorm.useTwinkleEffect = false;   // random flicker
        snowStorm.followMouse = false;        // wind follows the mouse
        snowStorm.excludeMobile = true;       // don't run on mobile (CPU/battery friendly)
        snowStorm.snowCharacter = '❄';        // flake glyph (&bull; or * also work well)

        // Manual control is also available:
        // snowStorm.stop();         // stop and hide
        // snowStorm.start();        // start
        // snowStorm.freeze();       // pause
        // snowStorm.resume();       // resume

        document.getElementById('toggle-snow').addEventListener('click', function () {
            snowStorm.toggleSnow();
        });
    </script>
</body>

</html>
